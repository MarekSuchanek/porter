[package]
name = "porter-backends"
description = "Storage backends (providers) for Porter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
directories = "6"
dunce = "1"
futures = "0.3"
keyring = "4.2"
opendal = { version = "0.59", features = ["services-s3", "services-sftp", "services-ftp", "services-memory"] }
porter-core.workspace = true
serde = { version = "1", features = ["derive"] }
sysinfo = { version = "0.37", default-features = false, features = ["disk"] }
tokio = { version = "1", features = ["fs", "rt", "sync"] }
tokio-util = { version = "0.7", features = ["compat"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["io-util", "macros", "rt-multi-thread"] }
