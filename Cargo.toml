[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
porter-core = { path = "crates/porter-core" }
porter-backends = { path = "crates/porter-backends" }
porter-jobs = { path = "crates/porter-jobs" }
