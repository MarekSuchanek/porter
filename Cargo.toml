[workspace]
resolver = "3"
members = ["crates/*"]
# The GUI needs the built frontend (ui/dist); build it with `npm run tauri build`.
default-members = ["crates/porter-core", "crates/porter-backends", "crates/porter-jobs", "crates/porter-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[workspace.dependencies]
porter-core = { path = "crates/porter-core" }
porter-backends = { path = "crates/porter-backends" }
porter-jobs = { path = "crates/porter-jobs" }
